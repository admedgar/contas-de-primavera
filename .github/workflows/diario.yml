# Atualização diária: coleta no portal oficial, confere os totais, registra alertas, publica o site no GitHub Pages.
# Configuração única no repositório: Settings > Pages > Source = "GitHub Actions". Variáveis/segredos opcionais no README.
name: Atualização diária
on:
  schedule:
    # O portal da prefeitura fica fora do ar de forma imprevisível (HTTP 530 de madrugada e também à tarde/noite em 14/10) e o GitHub
    # atrasa agendamentos em horas. Por isso há várias janelas por dia; o job "decidir" só deixa rodar se o site tiver mais de 20 horas.
    - cron: "17 3 * * *"          # 23:17 em Cuiabá
    - cron: "17 15 * * *"         # 11:17 em Cuiabá
    - cron: "17 19 * * *"         # 15:17 em Cuiabá
    - cron: "17 23 * * *"         # 19:17 em Cuiabá
  workflow_dispatch:
    inputs:
      completo:
        description: "Revisar também os anos fechados (2 anteriores)"
        type: boolean
        default: false
      so_visual:
        description: "Só publicar o código/visual atual sobre os DADOS já publicados (não coleta nem valida)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: contas-diario
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rodar: ${{ steps.d.outputs.rodar }}
      idade_h: ${{ steps.d.outputs.idade_h }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          # idade REAL do que está publicado (campo gerado_em do próprio site), em horas; 999 se não for possível ler
          url=$(python3 -c "import json;print((json.load(open('config/site.json')).get('url_site') or '').rstrip('/'))")
          [ -z "$url" ] && url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          idade=$(curl -fsS -m 30 "$url/data/meta.json" 2>/dev/null | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          g = json.load(sys.stdin)['gerado_em']
          print(int((datetime.now(timezone.utc) - datetime.strptime(g, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)).total_seconds() // 3600))" 2>/dev/null || echo 999)
          echo "site em $url com $idade h"
          echo "idade_h=$idade" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$idade" -gt 20 ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; else echo "rodar=false" >> "$GITHUB_OUTPUT"; fi

  atualizar:
    needs: decidir
    if: needs.decidir.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      CONTAS_CONTATO: ${{ vars.CONTAS_CONTATO }}      # vai no User-Agent enviado ao portal (opcional, recomendado)
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}        # opcional: se existir, o site também é publicado na Vercel
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restaurar banco (cache; se não houver, o plano diário reconstrói os 3 anos)
        if: ${{ !inputs.so_visual }}
        uses: actions/cache/restore@v4
        with:
          path: data/contas.sqlite
          key: contas-db-${{ github.run_id }}
          restore-keys: contas-db-

      - name: Testes
        run: python -m unittest discover -s tests -t .

      - name: Baixar o site já publicado (só visual)
        if: ${{ inputs.so_visual }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # artefato do último deploy do Pages = exatamente os dados que estão no ar
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=1" --jq '.artifacts[0].id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Nenhum site publicado anterior encontrado."; exit 1; }
          mkdir -p anterior-zip anterior
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > anterior.zip
          unzip -q anterior.zip -d anterior-zip
          tar -xf anterior-zip/artifact.tar -C anterior

      - name: Coletar, conferir, registrar alertas e gerar JSONs
        id: diario
        run: |
          set +e
          if [ "${{ inputs.so_visual }}" = "true" ]; then
            python -m contas republicar --de anterior
          else
            python -m contas diario ${{ inputs.completo && '--completo' || '' }}
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Publica se não houve divergência na conferência (bit 2) e se algo foi coletado (4 = portal fora do ar: nada mudou).
          if [ $((rc & 2)) -eq 0 ] && [ "$rc" != "4" ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; else echo "publicar=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Guardar banco para a próxima execução
        if: always() && !inputs.so_visual && hashFiles('data/contas.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/contas.sqlite
          key: contas-db-${{ github.run_id }}

      - name: Montar site
        if: steps.diario.outputs.publicar == 'true' && !inputs.so_visual
        run: python -m contas build
      - name: Configurar Pages
        if: steps.diario.outputs.publicar == 'true'
        uses: actions/configure-pages@v5
      - name: Enviar site
        if: steps.diario.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deploy
        if: steps.diario.outputs.publicar == 'true'
        uses: actions/deploy-pages@v4

      - name: Publicar na Vercel (só se VERCEL_TOKEN estiver configurado)
        if: steps.diario.outputs.publicar == 'true' && env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy dist --prod --yes --token "$VERCEL_TOKEN"

      - name: Avisar novos alertas (webhook opcional)
        if: steps.diario.outputs.publicar == 'true' && !inputs.so_visual
        env:
          ALERTA_WEBHOOK_URL: ${{ secrets.ALERTA_WEBHOOK_URL }}
        run: python -m contas notificar

      - name: Resultado
        if: always()
        run: |
          rc="${{ steps.diario.outputs.rc }}"
          idade="${{ needs.decidir.outputs.idade_h }}"
          {
            echo "### Atualização"
            echo "- código de saída: \`${rc}\` (0 ok · 1 falha em alguma fonte, o resto foi publicado · 2 divergência na conferência, **nada publicado** · 4 portal fora do ar, nada coletado)"
            echo "- idade do site antes desta execução: ${idade} h"
            if [ -f data/alertas_novos.json ]; then echo "- alertas novos: $(python -c "import json;print(len(json.load(open('data/alertas_novos.json'))))")"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "0" ]; then exit 0; fi
          if [ "$rc" = "4" ]; then
            echo "::warning::Portal da prefeitura fora do ar; o site foi mantido (${idade} h). Nova tentativa na próxima janela."
            if [ "$idade" -gt 36 ]; then echo "::error::Mais de 36 horas sem atualizar o site porque o portal segue fora do ar."; exit 1; fi
            exit 0
          fi
          echo "::error::Atualização com problema (código ${rc}). Veja o log da etapa de coleta."; exit 1
